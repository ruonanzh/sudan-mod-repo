<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>苏丹的卡牌编辑器</title>
    <!--
      Editor tool for a mod's `config/cards.json`.
      The page talks to the app only through the postMessage bridge, so the script stays external
      (the frame's CSP forbids inline scripts) and nothing here opens a network connection.
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #1b1b1f;
        --panel: #232327;
        --text: #e6e6e6;
        --muted: #9a9aa2;
        --border: #3a3a42;
        --accent: #6ea8fe;
        --danger: #ff6b6b;
        --warn: #e0a94a;
        --gold: #d8b45a;
      }
      [data-theme="light"] {
        color-scheme: light;
        --bg: #ffffff;
        --panel: #f6f6f8;
        --text: #1d1d20;
        --muted: #666670;
        --border: #d9d9e0;
        --accent: #2f6fdd;
        --danger: #c62828;
        --warn: #9a6b12;
        --gold: #8a6a12;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header.app {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 1;
      }
      header.app strong { margin-right: auto; }
      #status { font-size: 12px; color: var(--muted); }
      #status[data-state="dirty"] { color: var(--accent); }
      #status[data-state="error"] { color: var(--danger); }
      #status[data-state="readonly"] { color: var(--warn); }
      button {
        font: inherit;
        padding: 4px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      main { padding: 12px; display: grid; gap: 10px; max-width: 860px; padding-bottom: 96px; }
      .note { color: var(--muted); font-size: 12px; margin: 0; }
      code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--gold); }
      input, select, textarea {
        font: inherit;
        padding: 5px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        width: 100%;
      }
      input[readonly], textarea[readonly] { color: var(--muted); }
      textarea { resize: vertical; }
      .cards { display: grid; gap: 10px; }
      .card { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); padding: 10px; display: grid; gap: 8px; }
      .card[data-state="error"] { border-color: var(--danger); }
      .card-head { display: flex; align-items: center; gap: 10px; }
      .card-id { font-size: 13px; }
      .badge {
        font-size: 12px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
      }
      .card-state { margin-left: auto; font-size: 12px; color: var(--danger); }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      label { display: grid; gap: 3px; }
      .label { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
      .tags { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 10px; }
      .tags > .label { grid-column: 1 / -1; }
      .tag { grid-template-columns: 1fr 72px; align-items: center; gap: 2px 6px; font-size: 12px; }
      .tag-name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tag input { padding: 2px 6px; text-align: right; }
      .tag-note { grid-column: 1 / -1; color: var(--muted); font-size: 11px; }
      .tag.marker .tag-name { color: var(--muted); }
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--panel);
        border-top: 1px solid var(--border);
        padding: 8px 12px;
        display: grid;
        gap: 6px;
        max-height: 45vh;
        overflow: auto;
      }
      footer .actions { display: flex; align-items: center; gap: 10px; }
      footer .actions span { margin-left: auto; color: var(--muted); font-size: 12px; }
      #issues { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 12px; }
      #issues[hidden] { display: none; }
      #issues li.error { color: var(--danger); }
      #issues li.warn { color: var(--warn); }
    </style>
  </head>
  <body>
    <header class="app">
      <strong id="file">cards.json</strong>
      <span id="status" data-state="clean">已保存</span>
      <button id="reload" type="button">重新读取</button>
    </header>
    <main>
      <p class="note">
        这里改的是这个 mod 自己的 <code>config/cards.json</code>。保存只改你动过的那几个值：注释、字段顺序和没动过的卡都留在原样。
      </p>
      <p class="note">
        改完先跑 <code>node tools/lint.mjs</code> 校验，再安装。页面拦住的错误，<code>tools/lint.mjs</code> 也会报。
      </p>
      <div id="cards" class="cards"></div>
    </main>
    <footer>
      <ul id="issues" hidden></ul>
      <div class="actions">
        <span>错误会让保存按钮不可用；警告可以照常保存。</span>
        <button id="save" type="button" disabled>保存（Ctrl+S）</button>
      </div>
    </footer>
    <script type="module" src="editor.js"></script>
  </body>
</html>
